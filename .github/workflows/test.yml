name: Test

on:
  pull_request:
    paths:
      - 'Formula/*.rb'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'Formula/*.rb'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-combined:
    name: Test clang-tools (combined) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: Apple Silicon (arm64)
          - os: macos-latest
            arch: Apple Silicon (arm64)
          - os: macos-15-intel
            arch: Intel (x86_64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap and trust local repository
        run: |
          brew untap cpp-linter/homebrew-tap 2>/dev/null || true
          brew tap cpp-linter/homebrew-tap "$PWD"
          brew trust cpp-linter/tap

      - name: Install clang-tools (on ${{ matrix.arch }})
        run: brew install clang-tools
        timeout-minutes: 10

      - name: Test clang-tools (on ${{ matrix.arch }})
        run: brew test clang-tools
        timeout-minutes: 5

  test-individual:
    name: Test ${{ matrix.formula }} on ${{ matrix.os }}
    needs: test-combined
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-latest
          - macos-15-intel
        formula:
          # These three get clang's builtin headers and a script that sets
          # SDKROOT. clang-tidy@19 is the oldest version (MIN_VERSION in
          # scripts/update-formula.py) and checks the headers of an old release.
          - clang-tidy
          - clang-tidy@19
          - clang-query
          - clang-include-cleaner
          - llvm-cov
          - llvm-profdata
          - llvm-symbolizer
          - clang-scan-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap and trust local repository
        run: |
          brew untap cpp-linter/homebrew-tap 2>/dev/null || true
          brew tap cpp-linter/homebrew-tap "$PWD"
          brew trust cpp-linter/tap

      - name: Install ${{ matrix.formula }}
        run: brew install "$FORMULA"
        env:
          FORMULA: ${{ matrix.formula }}
        timeout-minutes: 10

      - name: Test ${{ matrix.formula }}
        run: brew test "$FORMULA"
        env:
          FORMULA: ${{ matrix.formula }}
        timeout-minutes: 5
