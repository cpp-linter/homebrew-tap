name: Update Formula

on:
  repository_dispatch:
    types: [new-release]
  schedule:
    # Daily check for new releases
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: macos-latest
    permissions:
      # push the update branch and open the pull request
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run update script
        run: bash scripts/update-formula.sh

      - name: Check for changes
        id: changes
        run: |
          # Use `git status --porcelain` rather than `git diff`: when the index
          # gains a new LLVM version the script *creates* Formula/*@<new>.rb,
          # and those files are untracked — `git diff` does not see them.
          if [ -z "$(git status --porcelain -- Formula)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update formulae from index.json"
          branch: auto-update-formulae
          delete-branch: true
          title: "chore: update formulae from index.json"
          body: |
            Automated update of Homebrew formulae from the
            [clang-tools-static-binaries index](https://cpp-linter.github.io/clang-tools-static-binaries/),
            which lists one release per LLVM version.

            - Regenerated `Formula/*.rb` with the URLs of each version's release and their SHA-256 checksums.
          labels: |
            automated
          assignees: |
            ${{ github.actor }}
